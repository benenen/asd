[package]
name = "asd"
description = "asd: terminal session mux — CLI, embedded daemon, and GUI in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "asd"
path = "src/main.rs"

# `cargo deb` metadata (make deb). The binary goes to /usr/bin; the license
# is taken from `[package].license`.
[package.metadata.deb]
maintainer = "benshi <shiben789@163.com>"
copyright = "2026, benshi"
section = "utils"
priority = "optional"
extended-description = """\
asd is a terminal session multiplexer client with an embedded headless \
daemon: one session = one PTY (shpool-style), a two-pane GUI, and SSH-remote \
session lists. This package ships the full binary (CLI + daemon + GUI)."""
assets = [
    ["target/release/asd", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/asd/README.md", "644"],
]

[features]
default = ["dioxus"]
# The GUI: Dioxus Desktop + ghostty-web in a webview. Drop it with
# `--no-default-features` for a headless-server binary — CLI + embedded daemon
# + TUI, with no webview linked. The terminal side is not optional.
dioxus = ["dep:asd-dioxus"]
# Compat alias for older build scripts/CI: "the default GUI".
gui = ["dioxus"]

[dependencies]
anyhow = { workspace = true }
asd-cli = { workspace = true }
asd-dioxus = { workspace = true, optional = true }

[dev-dependencies]
asd-proto = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
asd-cli = { path = "crates/asd-cli" }
asd-client = { path = "crates/asd-client" }
asd-dioxus = { path = "crates/asd-dioxus" }
asd-git = { path = "crates/asd-git" }
asd-daemon = { path = "crates/asd-daemon" }
asd-proto = { path = "crates/asd-proto" }
asd-tui = { path = "crates/asd-tui" }
asd-vt = { path = "crates/asd-vt" }

anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# 0.2.1 is the floor: 0.2.0 crashes reading a multi-codepoint grapheme cluster
# out of a cell (see crates/asd-vt/tests/vt.rs).
libghostty-vt = "0.2.1"
nix = { version = "0.30", features = ["signal", "process", "term", "fs"] }
# Must match the crossterm ratatui 0.30 pulls in: asd-cli and asd-tui drive the
# same terminal in one binary, and crossterm keeps process-global mode state, so
# two versions would each restore what only they knew about.
crossterm = "0.29"
# Pure-Rust git. Chosen over git2 so the Windows GNU cross-check does not have
# to carry a C toolchain. `sha1` is not optional: without it `gix_hash::Kind`
# has no variants and gix-hash itself fails to compile.
gix = { version = "0.87", default-features = false, features = [
    "sha1",
    "revision",
    "index",
    "max-performance-safe",
    "parallel",
] }
portable-pty = "0.9"
postcard = { version = "1", features = ["use-std"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "signal",
    "process",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

# Temporary pin for Windows VT input and bracketed-paste events. This is the
# pinned head of crossterm PR #1030; remove the patch after an equivalent
# crates.io release. A workspace-wide patch is required so ratatui and asd-cli
# cannot link separate process-global crossterm state.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm.git", rev = "94ed7154e35d24a2f643c61760e1eb05b8ca9e63" }

[profile.release]
lto = "thin"
