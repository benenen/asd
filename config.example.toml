# asd configuration — example.
#
# Two readers share this file and ignore each other's tables: the daemon reads
# `[session]`, and `asd ui` reads `[keys]`.
#
# Copy this to your config path and edit — the file is never auto-created, and
# both look for it at:
#   $ASD_CONFIG                        (if set, wins everywhere)
#   $XDG_CONFIG_HOME/asd/config.toml   (unix, if XDG_CONFIG_HOME is set)
#   ~/.config/asd/config.toml          (unix default)
#   %APPDATA%\asd\config.toml          (Windows)
#
#   mkdir -p ~/.config/asd
#   cp config.example.toml ~/.config/asd/config.toml
#
# That is the *config* directory, deliberately apart from the data directory
# the daemon rewrites (~/.local/share/asd, %LOCALAPPDATA%\asd) — nothing here
# is ever overwritten behind your back.
#
# Each reads it once at startup, so run `asd restart` after editing `[session]`
# and reopen `asd ui` after editing `[keys]`. Every key is optional — anything
# omitted uses the default shown below, and a missing or malformed file just
# means "all defaults".

[session]
# Lines of scrollback history each session's terminal keeps (how far you can
# scroll back / how much `asd peek --scrollback` returns). Default: 10000.
# 0 disables scrollback. Memory grows only with lines actually produced.
scrollback_lines = 10000

# Whether a restored session's recorded command runs by itself. Default: false.
# A restart recreates each session as a shell in its saved directory and types
# the command it was created with at that prompt *without* running it, so a
# restart never re-runs a deploy or a migration on its own — press Enter to run
# it, edit it first, or Ctrl+C to drop it. Set true to have restored commands
# run immediately; `asd daemon --run-restored-commands` does the same for a
# single daemon.
run_restored_commands = false


# ---------------------------------------------------------------------------
# `asd ui` key bindings. Read by the TUI; the daemon ignores this table.
#
# Two contexts. A `[keys.direct]` binding fires on its own, so it has to be a
# chord the session below would never want. A `[keys.prefix]` binding fires
# after the leader, where a bare letter is free to mean something.
#
# Each entry lists *all* the keys for that action, replacing the defaults
# rather than adding to them. Write a key as optional `Ctrl+`/`Alt+`/`Shift+`/
# `Super+` modifiers and one key name: a single character, an arrow (`Up`,
# `Down`, `Left`, `Right`), `Esc`, `Enter`, `Tab`, `BackTab`, `Backspace`,
# `PageUp`, `PageDown`, `Home`, `End`, `Insert`, `Delete`, or `F1`..`F12`. In
# `[keys.prefix]` a plain `a-z` names a range.
#
# Bindings that cannot be compiled — an unknown key, two actions on one key,
# something that shadows the leader — leave every default in place and say so
# on the notice line, so a typo here can never lock you out of your sessions.
# ---------------------------------------------------------------------------

# [keys]
# The prefix key. Press it, then a `[keys.prefix]` key. Default: "Ctrl+A".
# leader = "Ctrl+A"

# [keys.direct]
# Move through the session list without the prefix. Default: Ctrl+Alt+↓ / ↑.
# Some desktops take Ctrl+Alt+arrows for switching workspaces before the
# terminal ever sees them; if yours does, rebind here.
# select_next = ["Ctrl+Alt+Down"]
# select_previous = ["Ctrl+Alt+Up"]
# scroll_page_up = ["Shift+PageUp"]
# scroll_page_down = ["Shift+PageDown"]

# [keys.prefix]
# select_next = ["j", "Down"]
# select_previous = ["k", "Up"]
# create = ["c"]
# rename = ["r"]
# kill = ["x"]
# toggle_sidebar = ["b"]
# toggle_status = ["s"]
# Open the git graph overlay for the focused session's repository.
# toggle_git_graph = ["g"]
# reconnect = ["R"]
# quit = ["q"]
# cancel_prefix = ["Esc"]
