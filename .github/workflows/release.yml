name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual trigger to verify the build without cutting a tag

permissions:
  contents: write # create the release and upload assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full binary (CLI + daemon + GUI), built natively on each arch. aarch64
          # uses a native arm64 runner rather than a cross container: the cross
          # image is ubuntu 16.04 (glibc 2.23 / git 2.7), too old to build the
          # vendored ghostty via zig (`copy_file_range` needs glibc 2.27+).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # asd-dioxus (GUI, in the default features) pulls webkit2gtk-4.1 via
      # Dioxus Desktop → wry; its -sys crates need the GTK dev libraries. Both
      # matrix entries here are Linux (x86_64 + aarch64), so install
      # unconditionally.
      - name: Install GUI system deps (webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build (full)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          [ "$version" = "$REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          name="asd-${version}-${TARGET}"
          stage="$(mktemp -d)/${name}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/asd" "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/" || true
          tar -czf "${name}.tar.gz" -C "$(dirname "$stage")" "${name}"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.archive }}
          fail_on_unmatched_files: true
          # No generate_release_notes here: it APPENDS, and four build jobs
          # attaching to one release appended four copies of the notes (eight
          # once the tag was re-released). The `notes` job below writes them
          # once instead.

  # Native Windows build — the full binary (CLI + daemon + TUI + GUI), same
  # deliverable as Linux and macOS. This used to ship GUI-only, back when the
  # terminal side was Unix-only; the Named Pipe transport and the platform/
  # modules changed that, and windows-check.yml builds all three flavors on
  # every push to prove it. russh → aws-lc-sys needs NASM to assemble its
  # crypto; asd-vt needs Zig for the vendored ghostty.
  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # asd-dioxus's build.rs shells out to npm (esbuild vendor bundle). Pin a
      # Node so npm is on PATH; the build.rs invokes it via `cmd /C npm` because
      # `Command::new("npm")` can't resolve the `.cmd` shim on Windows.
      - name: Install Node (asd-dioxus build.rs runs npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install NASM (aws-lc-sys, pulled by russh)
        uses: ilammy/setup-nasm@v1

      - name: Build (full)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        id: pkg
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          if ($version -eq $env:REF_NAME) { $version = (git rev-parse --short HEAD) }
          $target = "x86_64-pc-windows-msvc"
          $name = "asd-$version-$target"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/asd.exe" $stage
          # asd.exe imports ghostty-vt.dll, so the DLL is part of the payload —
          # without it the exe dies at startup with "ghostty-vt.dll not found".
          # It is not statically linked despite libghostty-vt-sys asking for a
          # static link: the Zig build installs ghostty-vt.lib (the DLL's import
          # library) next to the real ghostty-vt-static.lib, and the crate emits
          # `rustc-link-lib=static=ghostty-vt`, which on MSVC resolves to
          # ghostty-vt.lib — the import library. Cargo never copies the DLL out
          # of OUT_DIR, so find it in the build directory and fail loudly if the
          # upstream layout moves.
          $dll = Get-ChildItem -Path "target/$target/release/build" -Recurse `
            -Filter ghostty-vt.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "ghostty-vt.dll not found under target/$target/release/build" }
          Copy-Item $dll.FullName $stage
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
          if (Test-Path README.md) { Copy-Item README.md $stage }
          Get-ChildItem $stage | ForEach-Object { Write-Host "staged $($_.Name) ($($_.Length) bytes)" }
          $archive = "$name.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.archive }}
          fail_on_unmatched_files: true
          # No generate_release_notes here: it APPENDS, and four build jobs
          # attaching to one release appended four copies of the notes (eight
          # once the tag was re-released). The `notes` job below writes them
          # once instead.

  # macOS — full binary (CLI + daemon + GUI); macOS is unix, so the daemon side
  # compiles. Apple Silicon (arm64) only, on a native runner; Zig builds the
  # vendored ghostty. The Intel (x86_64) leg was dropped: GitHub's macos-13
  # runners are frequently unavailable and were blocking the whole release.
  macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner so zig never cross-compiles ghostty (the
          # `<arch>-macos-none` cross target didn't link libSystem).
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build (full)
        # Zig needs the macOS SDK to resolve libSystem (posix_memalign, sigaction,
        # waitpid, …) when building the vendored ghostty; point it at the SDK
        # explicitly so the link doesn't fail with "undefined symbol".
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          [ "$version" = "$REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          name="asd-${version}-${TARGET}"
          stage="$(mktemp -d)/${name}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/asd" "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/" || true
          tar -czf "${name}.tar.gz" -C "$(dirname "$stage")" "${name}"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.archive }}
          fail_on_unmatched_files: true
          # No generate_release_notes here: it APPENDS, and four build jobs
          # attaching to one release appended four copies of the notes (eight
          # once the tag was re-released). The `notes` job below writes them
          # once instead.

  # Write the release notes exactly once, after every asset is attached. The
  # build jobs used to each pass generate_release_notes to action-gh-release,
  # which appends — so the body collected one "Full Changelog" line per job, and
  # re-releasing a tag doubled the collection again. Generating here and *setting*
  # the body makes the result identical no matter how many times a tag is built.
  #
  # The generated part is a commit list, which cannot say the things a reader
  # actually needs — that v0.1.10 breaks the protocol and both ends must be
  # upgraded together, say. So the body is two parts: human highlights, then the
  # generated changelog under a marker. Everything from the marker down belongs
  # to this job and is rewritten every run; everything above it is kept. That is
  # what keeps a re-release identical instead of nested.
  #
  # Highlights come from whichever human source exists, in this order:
  #   1. the body already on the release — what `gh release create --notes` left
  #      at cut time, or a later edit in the UI;
  #   2. the tag's annotation body, for when the release was created by the
  #      upload step with no body:
  #
  #        git tag -a v0.1.11 --cleanup=verbatim -F notes.md
  #
  #      `--cleanup=verbatim` is not optional. git's default cleanup treats a
  #      line starting with `#` as a comment and drops it, which silently eats
  #      every markdown heading in the notes — `### New` and friends vanished
  #      from v0.1.11's annotation exactly that way. The first line is the tag
  #      subject (use the version), and the body is everything after it.
  # Neither one: just the changelog, exactly as before.
  notes:
    name: release notes
    needs: [build, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so the annotated tag object (and its message) is present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          marker='<!-- generated notes below; this job rewrites everything under it -->'

          gh release view "$REF_NAME" --repo "$REPO" --json body --jq .body > body.md || : > body.md
          # Keep what is above the marker. Without one the body is all human
          # (first run), so it is kept whole.
          awk -v m="$marker" 'index($0, m) { exit } { print }' body.md > highlights.md

          # A body from before this job wrote a marker (every tag up to v0.1.10)
          # is entirely generated: one "**Full Changelog**" line. Left alone it
          # would be promoted to a highlight and printed twice the next time
          # that tag is re-released — which this repo does to rebuild a broken
          # asset. Treat it as no highlights at all.
          if ! grep -v '^[[:space:]]*$' highlights.md | grep -qv '^\*\*Full Changelog\*\*:'; then
            : > highlights.md
          fi

          # Nothing there: fall back to the tag annotation, minus its subject
          # line (that is just the version).
          if ! grep -q '[^[:space:]]' highlights.md; then
            git tag -l --format='%(contents:body)' "$REF_NAME" > highlights.md
          fi

          gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$REF_NAME" --jq .body > changelog.md

          {
            if grep -q '[^[:space:]]' highlights.md; then
              # Drop trailing blank lines: kept as-is they would accumulate one
              # more blank line on every re-release, and the point of this job
              # is that re-releasing changes nothing.
              awk '{ line[NR] = $0 }
                   END { for (i = 1; i <= NR; i++) if (line[i] ~ /[^[:space:]]/) last = i
                         for (i = 1; i <= last; i++) print line[i] }' highlights.md
              printf '\n'
            fi
            printf '%s\n\n' "$marker"
            cat changelog.md
          } > notes.md

          gh release edit "$REF_NAME" --repo "$REPO" --notes-file notes.md

  # Publish the npm installer (@shibenenen/asd) to the public npm registry after
  # every platform binary is attached to the release. The npm package ships no
  # binary — its postinstall downloads the matching asset from this release — so
  # it MUST publish only once the build jobs have uploaded their archives.
  # Requires an `NPM_TOKEN` repo secret: an npm "Automation" access token for the
  # shibenenen account (automation tokens bypass publish 2FA, as CI needs).
  npm:
    name: npm publish
    needs: [build, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Sync package version to the release tag
        working-directory: deploy/npm
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          echo "publishing @shibenenen/asd@${version}"
          # Keep the published version in lockstep with the release tag so the
          # postinstall fetches the v<version> assets this workflow just built.
          npm version --no-git-tag-version --allow-same-version "$version"

      - name: Validate the package (syntax + offline URL mapping, no network)
        working-directory: deploy/npm
        run: npm test

      - name: Publish to npm
        working-directory: deploy/npm
        env:
          # publishConfig in package.json pins access=public + the npmjs registry.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # npm refuses to overwrite a published version, so re-releasing a tag
          # (moving it to rebuild a broken asset) would fail here. It doesn't
          # need to publish: the package ships no binary, its postinstall
          # downloads the release asset at install time, so replacing the
          # asset on an existing tag already reaches everyone who installs
          # that version. `npm view <pkg>@<ver>` prints nothing (exit 0) when
          # the version is absent, so test the output, not the status.
          if [ -n "$(npm view "@shibenenen/asd@${version}" version 2>/dev/null)" ]; then
            echo "@shibenenen/asd@${version} is already on npm; the rebuilt assets"
            echo "reach its users via the postinstall download. Nothing to publish."
            exit 0
          fi
          npm publish
