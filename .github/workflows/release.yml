name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build-only preflight; never creates or publishes a release
  release:
    types: [published]

permissions:
  contents: write # create the release and upload assets

jobs:
  build-policy:
    name: release build policy
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow parser
        run: python3 -m pip install 'PyYAML==6.0.2'
      - name: Check portable CPU and draft publication contracts
        run: |
          python3 scripts/test_ghostty_cpu_baseline.py
          python3 scripts/test_release_workflow.py

  # Create the release exactly once, before anything can attach to it. The four
  # build jobs each ran "create or find" against a brand-new tag, and on v0.1.12
  # they raced: three landed on one release, the macOS job's create call made a
  # SECOND (draft) release, uploaded its asset there, then died finalizing it
  # with `already_exists: tag_name`. That failure then skipped the notes and npm
  # jobs, so a release that had built fine on every platform shipped with three
  # assets, an empty body, and nothing on npm.
  #
  # Serializing creation here leaves the build jobs with nothing to do but
  # upload to a release that already exists, which is not a race. The job is
  # deliberately NOT gated on a tag ref — a skipped job skips everything that
  # needs it, which would break the workflow_dispatch build check; the step
  # inside it is gated instead, so a manual run passes through in seconds.
  prepare:
    name: create draft release
    needs: build-policy
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release if the tag has none yet
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The tag annotation's body, read from the API instead of from a
          # checkout. `git tag -l --format='%(contents:body)'` is the obvious
          # way and it is WRONG here: actions/checkout force-updates the local
          # ref to point straight at the commit
          # (`git fetch ... +<sha>:refs/tags/<tag>`), so the annotated tag
          # object never reaches the runner and the format string silently
          # falls back to the COMMIT message. That is how v0.1.12 published a
          # body consisting of nothing but a Co-Authored-By trailer. The API
          # has the real object, and this job then needs no checkout at all.
          # No annotation, or the tag is lightweight, or the API is having a
          # bad day: print nothing and let the caller carry on. `|| return 0`
          # rather than `|| true` on the substitution — a failing `gh api`
          # prints the error JSON on stdout, so masking its exit status would
          # assign that JSON to $sha and go on to request a garbage path.
          annotation_body() {
            local sha
            sha="$(gh api "repos/${REPO}/git/ref/tags/$1" \
                     --jq 'select(.object.type == "tag") | .object.sha' \
                   2>/dev/null)" || return 0
            [ -n "$sha" ] || return 0
            # Drop the subject line and the blank line under it, as
            # `%(contents:body)` would.
            gh api "repos/${REPO}/git/tags/${sha}" --jq .message 2>/dev/null \
              | sed '1d' | sed '/./,$!d' || return 0
          }

          if state="$(gh release view "$REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "Refusing to replace assets on a published release; cut a new version." >&2
              exit 1
            fi
            echo "draft $REF_NAME already exists; continuing its build"
            exit 0
          fi
          # Seed the body from the tag annotation so a release is never empty,
          # even if the notes job later fails. That job rewrites everything
          # under its marker anyway, so this is a starting point, not the
          # final text.
          annotation_body "$REF_NAME" > notes.md
          gh release create "$REF_NAME" --repo "$REPO" \
            --title "$REF_NAME" --notes-file notes.md --draft --verify-tag

  build:
    name: ${{ matrix.target }}
    needs: prepare
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full binary (CLI + daemon + GUI), built natively on each arch. aarch64
          # uses a native arm64 runner rather than a cross container: the cross
          # image is ubuntu 16.04 (glibc 2.23 / git 2.7), too old to build the
          # vendored ghostty via zig (`copy_file_range` needs glibc 2.27+).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # asd-dioxus (GUI, in the default features) pulls webkit2gtk-4.1 via
      # Dioxus Desktop → wry; its -sys crates need the GTK dev libraries. Both
      # matrix entries here are Linux (x86_64 + aarch64), so install
      # unconditionally.
      - name: Install GUI system deps (webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build (full)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          [ "$version" = "$REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          name="asd-${version}-${TARGET}"
          stage="$(mktemp -d)/${name}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/asd" "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/" || true
          tar -czf "${name}.tar.gz" -C "$(dirname "$stage")" "${name}"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ARTIFACT_PATH: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail
          test -s "$ARTIFACT_PATH"
          # Recheck here: rerun-failed-jobs can bypass an earlier prepare job.
          # Upload never creates a release or changes its publication state.
          if [ "$(gh release view "$REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to upload to a published or unavailable release." >&2
            exit 1
          fi
          gh release upload "$REF_NAME" "$ARTIFACT_PATH" --repo "$REPO" --clobber

  # Native Windows build — the full binary (CLI + daemon + TUI + GUI), same
  # deliverable as Linux and macOS. This used to ship GUI-only, back when the
  # terminal side was Unix-only; the Named Pipe transport and the platform/
  # modules changed that, and windows-check.yml builds both flavors on
  # every push to prove it. russh → aws-lc-sys needs NASM to assemble its
  # crypto; asd-vt needs Zig for the vendored ghostty.
  windows:
    name: x86_64-pc-windows-msvc
    needs: prepare
    if: github.event_name != 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # asd-dioxus's build.rs shells out to npm (esbuild vendor bundle). Pin a
      # Node so npm is on PATH; the build.rs invokes it via `cmd /C npm` because
      # `Command::new("npm")` can't resolve the `.cmd` shim on Windows.
      - name: Install Node (asd-dioxus build.rs runs npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install NASM (aws-lc-sys, pulled by russh)
        uses: ilammy/setup-nasm@v1

      - name: Build (full)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        id: pkg
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          if ($version -eq $env:REF_NAME) { $version = (git rev-parse --short HEAD) }
          $target = "x86_64-pc-windows-msvc"
          $name = "asd-$version-$target"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/asd.exe" $stage
          # asd.exe imports ghostty-vt.dll, so the DLL is part of the payload —
          # without it the exe dies at startup with "ghostty-vt.dll not found".
          # It is not statically linked despite libghostty-vt-sys asking for a
          # static link: the Zig build installs ghostty-vt.lib (the DLL's import
          # library) next to the real ghostty-vt-static.lib, and the crate emits
          # `rustc-link-lib=static=ghostty-vt`, which on MSVC resolves to
          # ghostty-vt.lib — the import library. Cargo never copies the DLL out
          # of OUT_DIR, so find it in the build directory and fail loudly if the
          # upstream layout moves.
          $dll = Get-ChildItem -Path "target/$target/release/build" -Recurse `
            -Filter ghostty-vt.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "ghostty-vt.dll not found under target/$target/release/build" }
          Copy-Item $dll.FullName $stage
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
          if (Test-Path README.md) { Copy-Item README.md $stage }
          Get-ChildItem $stage | ForEach-Object { Write-Host "staged $($_.Name) ($($_.Length) bytes)" }
          $archive = "$name.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ARTIFACT_PATH: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail
          test -s "$ARTIFACT_PATH"
          # Recheck here: rerun-failed-jobs can bypass an earlier prepare job.
          # Upload never creates a release or changes its publication state.
          if [ "$(gh release view "$REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to upload to a published or unavailable release." >&2
            exit 1
          fi
          gh release upload "$REF_NAME" "$ARTIFACT_PATH" --repo "$REPO" --clobber

  # macOS — full binary (CLI + daemon + GUI); macOS is unix, so the daemon side
  # compiles. Apple Silicon (arm64) only, on a native runner; Zig builds the
  # vendored ghostty. The Intel (x86_64) leg was dropped: GitHub's macos-13
  # runners are frequently unavailable and were blocking the whole release.
  macos:
    name: ${{ matrix.target }}
    needs: prepare
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner so zig never cross-compiles ghostty (the
          # `<arch>-macos-none` cross target didn't link libSystem).
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build (full)
        # Zig needs the macOS SDK to resolve libSystem (posix_memalign, sigaction,
        # waitpid, …) when building the vendored ghostty; point it at the SDK
        # explicitly so the link doesn't fail with "undefined symbol".
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          [ "$version" = "$REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          name="asd-${version}-${TARGET}"
          stage="$(mktemp -d)/${name}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/asd" "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/" || true
          tar -czf "${name}.tar.gz" -C "$(dirname "$stage")" "${name}"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ARTIFACT_PATH: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail
          test -s "$ARTIFACT_PATH"
          # Recheck here: rerun-failed-jobs can bypass an earlier prepare job.
          # Upload never creates a release or changes its publication state.
          if [ "$(gh release view "$REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to upload to a published or unavailable release." >&2
            exit 1
          fi
          gh release upload "$REF_NAME" "$ARTIFACT_PATH" --repo "$REPO" --clobber

  # Write the release notes exactly once, after every asset is attached. The
  # build jobs used to each pass generate_release_notes to action-gh-release,
  # which appends — so the body collected one "Full Changelog" line per job, and
  # re-releasing a tag doubled the collection again. Generating here and *setting*
  # the body makes the result identical no matter how many times a tag is built.
  #
  # The generated part is a commit list, which cannot say the things a reader
  # actually needs — that v0.1.10 breaks the protocol and both ends must be
  # upgraded together, say. So the body is two parts: human highlights, then the
  # generated changelog under a marker. Everything from the marker down belongs
  # to this job and is rewritten every run; everything above it is kept. That is
  # what keeps a re-release identical instead of nested.
  #
  # Highlights come from whichever human source exists, in this order:
  #   1. the body already on the release — normally the tag annotation the
  #      `prepare` job seeded it with, or a later edit in the UI;
  #   2. the tag's annotation, read again here, for a release created by hand
  #      or by the upload step with no body.
  # Neither one: just the changelog, exactly as before.
  #
  # So the way to write release notes is to put them in the tag:
  #
  #     git tag -a v0.1.12 --cleanup=verbatim -F notes.md
  #
  # `--cleanup=verbatim` is not optional. git's default cleanup treats a line
  # starting with `#` as a comment and drops it, which silently eats every
  # markdown heading — `### New` and friends vanished from v0.1.11's annotation
  # exactly that way. The first line is the tag subject (use the version); the
  # body is everything after it.
  notes:
    name: release notes
    needs: [build, windows, macos]
    # Not `success()`: one platform failing should not also cost the release its
    # body, which is how v0.1.12 came out bodiless. The job SETS the text under
    # its marker, so running it on a partial release and again after the missing
    # platform is re-run produces the same result — there is nothing to lose by
    # writing it early.
    if: ${{ !cancelled() && github.event_name != 'release' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout: everything this job reads (the release body, the tag
    # annotation, the generated changelog) comes from the API. It used to check
    # out with fetch-depth 0 "so the annotated tag object is present", which was
    # never true — checkout overwrites that ref with the commit.
    steps:
      - name: Set the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          marker='<!-- generated notes below; this job rewrites everything under it -->'

          # Identical to the helper in `prepare` — see there for why the tag
          # annotation has to come from the API and not from `git tag -l`.
          annotation_body() {
            local sha
            sha="$(gh api "repos/${REPO}/git/ref/tags/$1" \
                     --jq 'select(.object.type == "tag") | .object.sha' \
                   2>/dev/null)" || return 0
            [ -n "$sha" ] || return 0
            gh api "repos/${REPO}/git/tags/${sha}" --jq .message 2>/dev/null \
              | sed '1d' | sed '/./,$!d' || return 0
          }

          if [ "$(gh release view "$REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
            echo "Release notes may only be assembled while the release is a draft." >&2
            exit 1
          fi
          gh release view "$REF_NAME" --repo "$REPO" --json body --jq .body > body.md || : > body.md
          # Keep what is above the marker. Without one the body is all human
          # (first run), so it is kept whole.
          awk -v m="$marker" 'index($0, m) { exit } { print }' body.md > highlights.md

          # A body from before this job wrote a marker (every tag up to v0.1.10)
          # is entirely generated: one "**Full Changelog**" line. Left alone it
          # would be promoted to a highlight and printed twice the next time
          # that tag is re-released — which this repo does to rebuild a broken
          # asset. Treat it as no highlights at all.
          if ! grep -v '^[[:space:]]*$' highlights.md | grep -qv '^\*\*Full Changelog\*\*:'; then
            : > highlights.md
          fi

          # Nothing there: fall back to the tag annotation, minus its subject
          # line (that is just the version). Read from the API, not from the
          # checkout — see the identical helper in the `prepare` job for why
          # `git tag -l --format='%(contents:body)'` returns the commit message
          # here instead of the annotation.
          if ! grep -q '[^[:space:]]' highlights.md; then
            annotation_body "$REF_NAME" > highlights.md
          fi

          gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$REF_NAME" --jq .body > changelog.md

          {
            if grep -q '[^[:space:]]' highlights.md; then
              # Drop trailing blank lines: kept as-is they would accumulate one
              # more blank line on every re-release, and the point of this job
              # is that re-releasing changes nothing.
              awk '{ line[NR] = $0 }
                   END { for (i = 1; i <= NR; i++) if (line[i] ~ /[^[:space:]]/) last = i
                         for (i = 1; i <= last; i++) print line[i] }' highlights.md
              printf '\n'
            fi
            printf '%s\n\n' "$marker"
            cat changelog.md
          } > notes.md

          gh release edit "$REF_NAME" --repo "$REPO" --notes-file notes.md

  # Publishing a validated draft is a separate, authenticated operator action.
  # The published event checks out the immutable release tag; it never rebuilds
  # or depends on jobs intentionally skipped for this event.
  npm:
    name: npm publish
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REF_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify the published release assets and package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${REF_NAME#v}"
          test "$(node -p "require('./deploy/npm/package.json').version")" = "$version"
          gh release view "$REF_NAME" --repo "$REPO" \
            --json tagName,isDraft,isPrerelease,assets > release.json
          python3 - "$REF_NAME" <<'PYCODE'
          import json, sys
          release = json.load(open("release.json"))
          tag = sys.argv[1]
          assert release["tagName"] == tag and not release["isDraft"] and not release["isPrerelease"]
          targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
          expected = {f"asd-{tag[1:]}-{target}." + ("zip" if "windows" in target else "tar.gz") for target in targets}
          actual = {asset["name"] for asset in release["assets"] if asset["size"] > 0}
          assert expected <= actual, f"missing release assets: {expected - actual}"
          PYCODE

      - name: Validate the package (syntax + offline URL mapping, no network)
        working-directory: deploy/npm
        run: npm test

      - name: Publish to npm
        working-directory: deploy/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          # npm versions are immutable. A retried published event is a no-op
          # when this exact installer version has already been published.
          if [ -n "$(npm view "@shibenenen/asd@${version}" version 2>/dev/null)" ]; then
            echo "@shibenenen/asd@${version} is already published."
            exit 0
          fi
          npm publish

      - name: Deprecate the withdrawn 0.2.0 installer
        if: github.event.release.tag_name == 'v0.2.1'
        working-directory: deploy/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test "$(npm view '@shibenenen/asd@0.2.1' version)" = 0.2.1
          deprecated="$(npm view '@shibenenen/asd@0.2.0' deprecated)"
          if [ -n "$deprecated" ]; then
            echo "The withdrawn 0.2.0 installer is already deprecated."
            exit 0
          fi
          npm deprecate '@shibenenen/asd@0.2.0' \
            'Withdrawn: the Linux x64 binary can crash with SIGILL on other CPUs. Upgrade to 0.2.1 or later.'
