[package]
name = "asd-daemon"
description = "asd headless mux daemon (library): session keeping, daemon server; embedded by the `asd` CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

# Contract (spec §3): depending on iced/wgpu is forbidden (including transitively).
[dependencies]
anyhow = { workspace = true }
asd-proto = { workspace = true }
asd-vt = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "network"] }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }
