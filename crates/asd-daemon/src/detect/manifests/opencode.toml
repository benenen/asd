# OpenCode.
#
# Written from captures of opencode 1.18.18 taken on this machine: the start
# screen, the prompt after a completed turn, a running turn, and a permission
# dialog. Every rule below is justified by one of the fixtures in ../fixtures.
#
# The terminal title is not usable for state here. It reads "OpenCode" until the
# first turn names the session, then keeps that name -- so it says the same
# thing whether the agent is working or waiting. Everything keys on the
# statusline instead.
#
# To widen this: run the session, capture the state, and add the rule the
# capture justifies -- see `captured_screen` in ../tests.rs.

id = "opencode"
version = "2026.08.20.2"
min_engine_version = 1

# A permission dialog takes over the prompt box. It outranks the running turn
# for the same reason Claude's does: a dialog is exactly where "still busy" and
# "needs a person" have to come apart. Verified against a capture.
[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(16)"
contains = ["permission required"]
any = [
  { contains = ["allow once"] },
  { contains = ["allow always"] },
]

# The interrupt hint opens the statusline for the whole turn. It reads
# "esc interrupt" -- no "to", unlike the other agents. Verified against a
# capture.
[[rules]]
id = "turn_in_progress"
state = "working"
priority = 970
region = "bottom_non_empty_lines(12)"
line = [{ contains = ["esc interrupt"] }]

# The composer at rest. "ctrl+p commands" closes the statusline on every screen
# that has one -- a running turn included -- so it identifies the TUI, not the
# state; the absence of the interrupt hint is what makes this idle. Verified
# against two captures: the start screen and the prompt after a turn.
[[rules]]
id = "composer_ready"
state = "idle"
priority = 800
region = "bottom_non_empty_lines(8)"
contains = ["ctrl+p commands"]
not = [{ contains = ["esc interrupt"] }]
