# Codex CLI.
#
# Thinner than Claude's on purpose. Only the idle prompt has been checked
# against a capture; the rest waits for a screen to justify it. An unmatched
# screen answers `unknown`, which claims nothing — a rule written from memory
# answers `idle` or `working`, which claims something false.
#
# Codex is installed as a node script, so its foreground command reads
# `node .../bin/codex`; the engine looks past the interpreter for the name.
#
# To widen this: run the session, capture each state, and add the rule the
# capture justifies — see `captured_screen` in ../tests.rs.

id = "codex"
version = "2026.08.20.1"
min_engine_version = 1

# The interrupt hint, where the build shows it. Unverified against a capture.
[[rules]]
id = "turn_in_progress"
state = "working"
priority = 970
region = "bottom_non_empty_lines(12)"
line = [{ contains = ["esc to interrupt"] }]

# An approval dialog waiting on a choice. Unverified against a capture.
[[rules]]
id = "approval_prompt"
state = "blocked"
priority = 900
region = "bottom_non_empty_lines(16)"
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"] },
]

# The composer at rest: a single-guillemet prompt line above the model and
# context statusline. Verified against a capture.
[[rules]]
id = "composer_ready"
state = "idle"
priority = 800
region = "bottom_non_empty_lines(8)"
line = [{ starts_with = ["›"] }]
not = [
  { contains = ["esc to interrupt"] },
  { contains = ["esc to cancel"] },
]
